{% extends "base.html" %}
{% block content %}
<div class="alert alert-success">
    <h4 class="alert-heading">Booking confirmed!</h4>
    <p>Thank you, {{ name }}. Your booking for {{ room.name }} is confirmed.</p>
    <hr>
    <p class="mb-0">
        Check‑in: {{ check_in }}<br>
        Check‑out: {{ check_out }}
    </p>
</div>
<a href="{{ url_for('home') }}" class="btn btn-link">Back to home</a>
{% endblock %}
