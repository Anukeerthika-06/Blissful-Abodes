{% extends 'base.html' %}
{% block title %}Admin Login - Blissful Abodes{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
                <div class="card-body p-5 text-center">
                    <h3 class="mb-4"><i class="fas fa-user-shield me-2"></i>Admin Login</h3>

                    <!-- Display error message if exists -->
                    {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <form method="POST">
                        <div class="mb-4 text-start">
                            <label class="form-label">Admin Username</label>
                            <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
                        </div>
                        <div class="mb-4 text-start">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                        </div>
                        <button type="submit" class="btn btn-light w-100 mb-3">Admin Login</button>
                    </form>

                    <div class="text-center">
                        <hr style="border-color: rgba(255,255,255,0.4);">
                        <!-- Removed Create Admin Account button -->
                        <a href="{{ url_for('index') }}" class="btn btn-outline-light w-100">← Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
